# HUB DIGI — build, push GHCR, deploy VPS over SSH (pattern DIGI-AGENCY).
# GitHub Secrets requis :
#   SSH_HOST  IP/hostname VPS (même que DIGI-AGENCY)
#   SSH_USER  user SSH sur le VPS
#   SSH_KEY   clé privée autorisée sur le VPS
# Prérequis VPS (une fois) : docker + plugin compose, repo cloné vers
# /var/www/hub-digi, vrai backend/.env (voir deploy/.env.production.example),
# GHCR login (docker login ghcr.io -u USER), nginx + certbot (voir deploy/).
name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=https://hub.digicom.ml/api/v1
            VITE_PAIEMENT_ACTIF=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /var/www/hub-digi
            git pull origin main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker compose ps
