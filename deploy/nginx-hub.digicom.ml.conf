# HUB DIGI — extension nginx aaPanel (VPS digicom, panel en /www/server/panel/).
# Le vhost hub.digicom.ml.conf est géré par le panel (SSL, well-known, logs) :
# NE PAS l'écraser. Placer ce fichier vers :
#   /www/server/panel/vhost/nginx/extension/hub.digicom.ml/hub-proxy.conf
# puis : nginx -t && nginx -s reload
# Port 8002 = conteneur hub-digi (8000 = digi-agency, 8001 = bsgroup).
#
# Les ^~ forcent le proxy face aux regex images/js du panel (qui serviraient
# /www/wwwroot/hub.digicom.ml vide -> 404). Les location = exactes couvrent
# les fichiers racine du build Vite (manifest, favicons).

client_max_body_size 10M;
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
}
location ^~ /admin/ {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
}
location ^~ /static/ {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
}
location ^~ /media/ {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
}
location ^~ /assets/ {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
}
location ^~ /logo/ {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
}
location ^~ /entete/ {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
}
location = /favicon.ico { proxy_pass http://127.0.0.1:8002; }
location = /favicon-96x96.png { proxy_pass http://127.0.0.1:8002; }
location = /apple-touch-icon.png { proxy_pass http://127.0.0.1:8002; }
location = /site.webmanifest { proxy_pass http://127.0.0.1:8002; }
location = /web-app-manifest-192x192.png { proxy_pass http://127.0.0.1:8002; }
location = /web-app-manifest-512x512.png { proxy_pass http://127.0.0.1:8002; }
location = /push-sw.js { proxy_pass http://127.0.0.1:8002; }
location / {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
}
