# HUB DIGI — nginx reverse proxy pour gunicorn (pattern DIGI-AGENCY).
# VPS : copier vers /etc/nginx/sites-available/hub.digicom.ml, symlink
# sites-enabled, puis :
#   certbot --nginx -d hub.digicom.ml
# Port 8002 = conteneur hub-digi (8000 = digi-agency, 8001 = bsgroup, pas de clash).

upstream hub_digi {
    server 127.0.0.1:8002;
}

server {
    listen 80;
    server_name hub.digicom.ml;
    return 301 https://hub.digicom.ml$request_uri;
}

server {
    listen 443 ssl;
    server_name hub.digicom.ml;

    # Managed by certbot (paths filled in by certbot --nginx):
    # ssl_certificate /etc/letsencrypt/live/hub.digicom.ml/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hub.digicom.ml/privkey.pem;

    client_max_body_size 10M;  # scans décharges + cachets

    # /static/ servi direct si le dossier hôte existe (collectstatic déporté) ;
    # sinon tout passe au proxy et WhiteNoise sert depuis le conteneur
    # (même fallback que DIGI-AGENCY).
    location /static/ {
        alias /var/www/hub-digi/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_intercept_errors on;
        error_page 404 = @hub_backend;
    }

    # PAS de bloc /media/ ici : les uploads vivent dans le volume Docker
    # media_data (/app/media du conteneur), invisible depuis l'hôte.
    # /media/ doit atteindre Django (config/urls.py le sert en prod),
    # donc il tombe dans le proxy_pass ci-dessous.

    # PAS de bloc /assets/ ni try_files frontend ici : le build Vite vit
    # DANS l'image (frontend_dist/), servi par WhiteNoise + fallback SPA
    # Django. Tout passe au proxy.

    location @hub_backend {
        proxy_pass http://hub_digi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://hub_digi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
